name: Manual Test Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis
          - name: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute artifact metadata
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's|/|-|g' | tr -cd '[:alnum:]-_')
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "SAFE_BRANCH=${SAFE_BRANCH}" >> $GITHUB_ENV

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app bundles
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.platform.args }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logledge-${{ matrix.platform.name }}-${{ env.SAFE_BRANCH }}-${{ env.SHORT_SHA }}
          path: src-tauri/target/**/release/bundle/**
          retention-days: 14
          if-no-files-found: error
