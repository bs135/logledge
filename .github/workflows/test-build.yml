name: Manual Test Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-check:
    name: Fail-Fast Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -v ./...

  build-matrix:
    name: Build (${{ matrix.platform.name }})
    needs: [pre-check]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-amd64
            target: windows/amd64
            os: windows-latest
            build_args: -nsis -webview2 download
          - name: darwin-universal
            target: darwin/universal
            os: macos-latest
            build_args: ""
          - name: linux-amd64
            target: linux/amd64
            os: ubuntu-latest
            build_args: -tags webkit2_41
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute artifact metadata
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's|/|-|g' | tr -cd '[:alnum:]-_')
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "SAFE_BRANCH=${SAFE_BRANCH}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Wails App
        shell: bash
        run: |
          wails build -platform ${{ matrix.platform.target }} -trimpath -o logledge ${{ matrix.platform.build_args }}

      - name: Archive macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/bin
          zip -r -y "logledge-${{ matrix.platform.name }}.zip" logledge.app

      - name: Archive Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd build/bin
          chmod +x logledge
          tar -czvf "logledge-${{ matrix.platform.name }}.tar.gz" logledge

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logledge-${{ matrix.platform.name }}-${{ env.SAFE_BRANCH }}-${{ env.SHORT_SHA }}
          path: |
            build/bin/*
            !build/bin/logledge.app
          retention-days: 14
