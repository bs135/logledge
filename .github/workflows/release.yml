name: Release

# Build đóng gói cho cả 3 nền tảng (Windows/macOS/Linux) khi tag dạng v* được
# push. Chạy trên GitHub Actions (có đủ quyền admin + toolchain cần thiết cho
# NSIS/dmg/AppImage) — không thể build/test đầy đủ trên máy dev sandbox hiện
# tại vì thiếu quyền admin để cài NSIS cục bộ (xem ghi chú trong plan.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: windows/amd64
            os: windows-latest
          - platform: darwin/universal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dAppServer/wails-build-action@v3
        with:
          build-name: logledge
          build-platform: ${{ matrix.platform }}
          go-version: "1.25"
          node-version: "24.x"
          nsis: true
