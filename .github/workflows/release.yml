name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Automation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release-Please
        uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build Release (${{ matrix.platform.name }})
    needs: [release-please]
    if: |
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (needs.release-please.outputs.releases_created == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-amd64
            target: windows/amd64
            os: windows-latest
          - name: darwin-universal
            target: darwin/universal
            os: macos-latest
          - name: linux-amd64
            target: linux/amd64
            os: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        shell: bash
        run: |
          if [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            RELEASE_TAG="${{ needs.release-please.outputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            RELEASE_TAG="${LATEST_TAG}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "Resolved release tag: ${RELEASE_TAG}"

      - name: Build Wails App
        uses: dAppServer/wails-build-action@v3
        with:
          build-name: logledge
          build-platform: ${{ matrix.platform.target }}
          go-version: "1.25"
          node-version: "24.x"
          package: "false"
        env:
          WAILS_NSIS: "true"

      - name: Package Release Assets
        shell: bash
        run: |
          RELEASE_DIR="release-assets"
          mkdir -p "${RELEASE_DIR}"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            if [ -f "build/bin/logledge.exe" ]; then
              cp "build/bin/logledge.exe" "${RELEASE_DIR}/logledge-windows-amd64-${RELEASE_TAG}.exe"
            fi
            if [ -f "build/bin/logledge-amd64-installer.exe" ]; then
              cp "build/bin/logledge-amd64-installer.exe" "${RELEASE_DIR}/logledge-windows-amd64-installer-${RELEASE_TAG}.exe"
            fi
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            if [ -d "build/bin/logledge.app" ]; then
              cd build/bin
              zip -r -y "../../${RELEASE_DIR}/logledge-darwin-universal-${RELEASE_TAG}.zip" logledge.app
              cd ../..
            fi
          elif [ "${RUNNER_OS}" = "Linux" ]; then
            if [ -f "build/bin/logledge" ]; then
              chmod +x build/bin/logledge
              tar -czvf "${RELEASE_DIR}/logledge-linux-amd64-${RELEASE_TAG}.tar.gz" -C build/bin logledge
              cp "build/bin/logledge" "${RELEASE_DIR}/logledge-linux-amd64-${RELEASE_TAG}"
            fi
          fi

          # Generate SHA256 checksums
          cd "${RELEASE_DIR}"
          for item in *; do
            if [ -f "$item" ]; then
              (sha256sum "$item" > "$item.sha256") 2>/dev/null || (shasum -a 256 "$item" > "$item.sha256")
            fi
          done
          cd ..

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform.name }}-${{ env.RELEASE_TAG }}
          path: release-assets/*
          retention-days: 14

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it does not exist yet (e.g. manual tag push without release-please)
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --generate-notes || true
          fi
          # Upload all bundles and checksums to GitHub Release
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
