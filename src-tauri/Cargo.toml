[package]
name = "logledge"
version = "0.6.0"
description = "Local-first Markdown note-taking app synced via GitHub"
authors = ["bs135"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "logledge_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = "0.4"
dirs = "6"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
mime_guess = "2"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
trash = "5"
url = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
